<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAR หน้าแรก — Prototype</title>
<!-- PROTOTYPE (throwaway) — home page. Wording: copy.js · colours/config: kit.js · shared styles: kit.css -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap">
<style>html.ld-on{background:#E8F1FF}</style>
<script>try{if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.className="ld-on ld-hold"}catch(e){}</script>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<div id="root"></div>
<script src="copy.js"></script>
<script src="kit.js"></script>
<script>
/* ---------- state ---------- */
const st = { subjects: [], draft: [] };   // subjects = applied filter, draft = ticked in the open dialog
const setStatus = (s) => { $('#status').textContent = s; };
const H2 = 'margin: 0; font-size: 30px; line-height: 42px; font-weight: 600; color: var(--primary-default);';

/* ---------- static shell ---------- */
function shell() {
  const MC = T.myCourses;
  return `
  <p role="status" class="sr" id="status"></p>
  ${kitHeader({ active: 'home' })}
  <div style="flex-grow: 1; display: flex; flex-wrap: wrap;">
    <nav class="rail in0" aria-label="${esc(T.navLabel)}" style="flex: 0 0 84px; background: #FFFFFF; display: flex; flex-direction: column;">${kitRail('home')}</nav>
    <main style="flex: 999 1 560px; min-width: 0; background: #FAFAFA; border: 1px solid var(--border-default); border-radius: 16px 0 0 0; padding: 32px 32px 48px; box-sizing: border-box; overflow-x: clip;">
      <div style="max-width: ${contentMax()}; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;">
        <section class="in1" aria-labelledby="hello-h" style="position: relative; overflow: hidden; border-radius: 20px; background: var(--primary-default); color: var(--primary-onDefault); padding: 36px 40px 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px 40px; min-height: 248px; box-sizing: border-box;">
          ${S.heroDecor(C, I)}
          <div id="heroCol" style="position: relative; flex: 1 1 440px; min-width: 0; align-self: center; padding-bottom: 36px; display: flex; flex-direction: column; gap: 12px;">
            <p style="margin: 0; font-size: 18px; line-height: 28px; color: var(--primary-mutedDefault);">${esc(T.greeting)}</p>
            <h1 id="hello-h" style="margin: 0; font-size: 32px; line-height: 44px; font-weight: 700; letter-spacing: 0.25px;">${esc(T.headline)}</h1>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;">
              <a href="#" class="ctaMain" style="display: inline-flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 20px 0 6px; border-radius: 9999px; background: var(--bg-surface); color: var(--primary-default); font-size: 18px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 12px rgba(0,12,40,.3);"><span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 9999px; background: var(--primary-default); display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 5.5v13l10.5-6.5z" fill="#FFFFFF"></path></svg></span>${esc(T.startButton)}</a>
            </div>
          </div>
          <div style="position: relative; flex: 0 0 320px; height: 236px; align-self: flex-end;">${S.astro(C, I, 0, 0, esc(T.astronautAria))}</div>
        </section>
        <section class="in3" aria-labelledby="assign-h" id="assignSec" style="display: flex; flex-direction: column; gap: 16px; margin-top: 12px;"></section>
        <section class="in3" aria-labelledby="mycourse-h" style="display: flex; flex-direction: column; gap: 16px; margin-top: 12px;">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;">
            <h2 id="mycourse-h" style="${H2}">${esc(MC.title)}</h2>
            <a href="${esc(T.navLinks.courses || '#')}" style="font-size: 18px; line-height: 28px; font-weight: 600;">${esc(MC.all)}</a>
          </div>
          <ul class="cgrid hgrid af-scope" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px;">${MC.list.map(courseCard).join('')}</ul>
        </section>
      </div>
    </main>
  </div>
  <dialog id="fm" class="fmodal" aria-labelledby="fm-title" aria-describedby="fm-sub"></dialog>`;
}

/* ---------- assignments ---------- */
const assignData = () => T.assignments.filter((a) => a.state === 'todo').map((a) => Object.assign({}, a, { due: new Date(a.due) }));
const subjOk = (a) => !st.subjects.length || st.subjects.includes(a.subject);
function renderAssign(focusId) {
  const n = st.subjects.length;
  const list = assignData().filter(subjOk).sort((x, y) => x.due - y.due).slice(0, 4);
  const cards = list.map((a) => {
    const pct = Math.round(a.done / a.total * 100), p2 = (v) => String(v).padStart(2, '0');
    const date = `${T.weekdaysShort[a.due.getDay()]} ${a.due.getDate()} ${T.monthsShort[a.due.getMonth()]} ${a.due.getFullYear() + 543}`;
    const time = `${p2(a.due.getHours())}:${p2(a.due.getMinutes())}${T.timeSuffix}`;
    return `<li class="acard af-scope" style="min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid var(--border-default); border-radius: 16px; background: var(--bg-surface);">
      <p title="${esc(a.subject)}" style="margin: 0 0 -6px; font-size: 18px; line-height: 28px; height: 28px; font-weight: 600; color: var(--fn-information-inverted, #0A66C2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${esc(a.subject)}</p>
      <h3 style="margin: 0; font-size: 22px; line-height: 32px; font-weight: 600; color: var(--text-base-default); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 64px; height: 64px; flex: 0 0 64px;">${esc(a.title)}</h3>
      <dl style="margin: 0; display: flex; flex-wrap: wrap; gap: 0 14px; min-height: 28px; font-family: 'Sarabun', var(--font-sans); font-size: 18px; line-height: 28px; color: var(--text-base-subtle);">
        <div style="display: flex; align-items: center; gap: 6px;"><dt style="display: flex;">${icon('calendar-big-square', 20)}<span class="sr">${esc(T.dueDateSr)}</span></dt><dd style="margin: 0;">${esc(date)}</dd></div>
        <div style="display: flex; align-items: center; gap: 6px;"><dt style="display: flex;">${icon('clock-time-timer-fast', 20)}<span class="sr">${esc(T.dueTimeSr)}</span></dt><dd style="margin: 0;">${esc(time)}</dd></div>
      </dl>
      ${progressBar(pct, `${a.done} / ${a.total} ${T.progressUnit}`, pct + '%', 'accent')}
      <div aria-hidden="true" style="flex-grow: 1; margin-top: -14px;"></div>
      ${fsBtn('secondary', T.cardButton)}
    </li>`;
  }).join('');
  $('#assignSec').innerHTML = `
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;">
      <h2 id="assign-h" style="${H2}">${esc(T.assignTitle)}</h2>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 18px; line-height: 28px; color: var(--text-subtle);">${esc(T.filterPrefix)}</span>
        <button type="button" id="filterBtn" class="filterTrigger" data-act="openFilter" aria-haspopup="dialog" aria-label="${esc(T.filterButtonAria + (n ? f(T.filterCountAria, { n }) : ''))}" style="display: inline-flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 ${n ? 10 : 18}px 0 16px; border-radius: 12px; border: ${n ? '2px solid var(--primary-pressed)' : '1px solid var(--border-default)'}; background: var(--bg-surface); color: var(--text-default); font: 600 18px/26px 'Sarabun', system-ui, sans-serif; cursor: pointer;"><svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><path d="M7 5h18a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"></path><text x="16" y="20.5" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" font-family="Sarabun, sans-serif">กฮ</text></svg>${esc(T.filterPlaceholder)}${n ? `<span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; border: 1px solid var(--border-default); font-size: 16px; font-weight: 600;">${n}</span>` : ''}</button>
      </div>
    </div>
    ${list.length ? '' : `<div style="padding: 40px 24px; border: 1px dashed var(--border-emphasized); border-radius: 16px; background: var(--bg-surface); text-align: center;"><p style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 600;">${esc(T.emptyTitle)}</p><p style="margin: 4px 0 0; font-size: 16px; line-height: 24px; color: var(--text-subtle);">${esc(T.emptyText)}</p></div>`}
    <ol class="agrid" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;">${cards}</ol>`;
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
}

/* ---------- filter dialog (native <dialog>: focus trap + Esc for free; ticks only apply on "เลือกตัวกรอง") ---------- */
const FF = "font: 600 18px/26px 'Sarabun', system-ui, sans-serif;";
function renderModal(focusOpt) {
  const tiles = T.subjectGroups.map((g, i) => {
    const on = st.draft.includes(g.label);
    return `<button type="button" role="checkbox" aria-checked="${on}" class="subjTile" data-opt="${i}" style="position: relative; min-height: 120px; padding: 40px 12px 16px; border-radius: 12px; border: ${on ? '2px solid var(--primary-default)' : '1px solid var(--border-default)'}; background: ${on ? 'var(--primary-mutedDefault)' : 'var(--bg-muted)'}; color: var(--text-default); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font: 400 18px/26px 'Sarabun', system-ui, sans-serif; text-align: center;">
      <span aria-hidden="true" style="position: absolute; left: 12px; top: 12px; width: 24px; height: 24px; box-sizing: border-box; border-radius: 6px; border: ${on ? '0' : '1.5px solid var(--border-emphasized)'}; background: ${on ? 'var(--primary-default)' : 'var(--bg-surface)'}; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="16" height="16" style="opacity: ${on ? 1 : 0};"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      <svg viewBox="0 0 32 32" width="36" height="36" aria-hidden="true" style="color: ${on ? 'var(--primary-default)' : 'var(--text-subtle)'};"><path d="${g.icon}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span>${esc(g.label)}</span></button>`;
  }).join('');
  const none = !st.draft.length;
  $('#fm').innerHTML = `
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 24px 16px; border-bottom: 1px solid var(--border-default);">
      <div>
        <h2 id="fm-title" style="margin: 0; font-size: 26px; line-height: 36px; font-weight: 700; color: var(--text-default);">${esc(T.filterTitle)}</h2>
        <p id="fm-sub" style="margin: 2px 0 0; font-size: 18px; line-height: 28px; color: var(--text-subtle);">${esc(T.filterSub)}</p>
      </div>
      <button type="button" class="iconBtn" data-act="closeFilter" aria-label="${esc(T.filterClose)}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--text-default); display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
    </div>
    <div role="group" aria-labelledby="fm-sub" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 24px;">${tiles}</div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 24px 24px; border-top: 1px solid var(--border-default);">
      <button type="button" class="linkBtn" data-act="clearDraft" ${none ? 'disabled' : ''} style="height: 44px; padding: 0 4px; border: 0; background: transparent; ${FF} color: ${none ? 'var(--text-faint)' : 'var(--primary-default)'}; cursor: pointer;">${esc(T.filterClear)}</button>
      <div style="display: flex; gap: 12px;">
        <button type="button" class="ghostBtn" data-act="closeFilter" style="height: 48px; min-width: 120px; padding: 0 24px; border-radius: 9999px; border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-default); ${FF} cursor: pointer;">${esc(T.filterCancel)}</button>
        <button type="button" class="solidBtn" data-act="applyFilter" style="height: 48px; min-width: 140px; padding: 0 24px; border-radius: 9999px; border: 0; background: var(--primary-default); color: var(--primary-onDefault); ${FF} cursor: pointer;">${esc(T.filterApply)}</button>
      </div>
    </div>`;
  if (focusOpt != null) { const el = $(`[data-opt="${focusOpt}"]`, $('#fm')); if (el) el.focus(); }
}
function toggleSubject(i) {
  const v = T.subjectGroups[i].label, k = st.draft.indexOf(v);
  if (k >= 0) st.draft.splice(k, 1); else st.draft.push(v);
  renderModal(i);
}
function applyFilter() {
  st.subjects = st.draft.slice();
  setStatus(st.subjects.length ? f(T.status.filtered, { subjects: st.subjects.join(', ') }) : T.status.filterCleared);
  $('#fm').close(); renderAssign('filterBtn');
}

/* ---------- my courses ---------- */
const courseCard = (c) => {
  const MC = T.myCourses, CT = T.courses, pct = Math.round(c.done / c.lessons * 100);
  return `<li style="min-width: 0; display: flex;"><article class="af-course scard" style="width: 100%;">
    <div class="af-course-cover"><img class="af-course-img" src="${COVERS[c.cover]}" alt="">
      <span style="position: absolute; left: 0; top: 0; padding: 4px 16px; border-radius: 0 0 14px 0; background: ${TAG_COLOR[c.cover] || 'var(--primary-default)'}; color: #FFFFFF; font: 700 28px/40px var(--font-sans); letter-spacing: .25px;">${esc(CT.gradeTag)}</span>
      <span class="af-course-menu"><button type="button" class="af-btn af-btn--secondary-accent af-btn--md af-btn--icon-only" aria-label="${esc(f(CT.menuAria, { title: c.title }))}">${afIcon('icon-dots-horizontal', 20)}</button></span></div>
    <div class="af-course-meta">
      <div class="af-course-subject" title="${esc(c.subject)}" style="font-size: 18px; line-height: 28px; height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${esc(c.subject)}</div>
      <h3 class="af-course-title" style="font-size: 20px; line-height: 28px; height: 56px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${esc(c.title)}</h3>
      <p style="margin: 0; padding-top: 12px; display: flex; align-items: center; gap: 6px; font-size: 18px; line-height: 28px; color: var(--text-base-subtle);">${icon('book-open', 20)}${esc(f(MC.lessons, { n: c.lessons }))}</p>
      <div class="af-course-foot mcfoot">${progressBar(pct, f(MC.progress, c), pct + '%', 'accent')}<button type="button" class="af-btn af-btn--secondary-accent af-btn--lg"><span class="af-btn-label">${esc(MC.cardButton[c.done >= c.lessons ? 'done' : 'doing'])}</span></button></div>
    </div></article></li>`;
};

/* ---------- boot + events ---------- */
const root = $('#root');
kitMount(root, CONFIG.reduceMotion);
root.innerHTML = shell();
renderAssign();

root.addEventListener('click', (e) => {
  const fm = $('#fm');
  if (e.target === fm) return fm.close();   // click on the backdrop
  const t = e.target.closest('[data-act],[data-opt]'); if (!t) return;
  if (t.dataset.opt !== undefined) return toggleSubject(+t.dataset.opt);
  const a = t.dataset.act;
  if (a === 'openFilter') { st.draft = st.subjects.slice(); renderModal(); fm.showModal(); }
  else if (a === 'closeFilter') fm.close();
  else if (a === 'clearDraft') { st.draft = []; renderModal(); }
  else if (a === 'applyFilter') applyFilter();
});
</script>
</body>
</html>
