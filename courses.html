/* =====================================================================
 * PROTOTYPE page 2: คอร์สเรียน (courses). Wording -> copy.js (COPY.courses).
 * Colours / look shared with the home page -> kit.js CONFIG.

const CT = T.courses;
document.title = CT.pageTitle;
const TAG_COLOR = { math: '#1976D2', thai: '#C25E00', sci: '#4E8F1F', eng: '#6B4FCF', soc: '#8A6A00', hist: '#C2334A' };
const statusOf = (c) => (c.done === 0 ? 'new' : c.done >= c.lessons ? 'done' : 'doing');
const STATUSES = ['all', 'doing', 'new', 'done'];
const cst = { tab: 'all' };
const setStatus = (s) => { $('#status').textContent = s; };

function shell() {
  const middle = `<div class="af-scope" style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 4px;"><a href="${esc(T.navLinks.home || '#')}" class="backBtn" aria-label="${esc(CT.backAria)}" style="flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--icon-base-default); text-decoration: none;"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    <nav aria-label="${esc(CT.crumbsAria)}" class="af-crumbs"><ol><li><a class="af-crumb" href="${esc(T.navLinks.home || '#')}">${esc(CT.crumbHome)}</a>${afIcon('icon-chevrons-right', 16, 'af-icon af-crumb-sep')}</li><li><span class="af-crumb is-current" aria-current="page">${esc(CT.crumbCourses)}</span></li></ol></nav></div>`;
  const stats = CT.stats.map((s) => `<div style="display: flex; align-items: center; gap: 10px;"><span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 10px; background: var(--primary-mutedDefault); color: var(--primary-default); display: flex; align-items: center; justify-content: center;">${icon(s.icon, 24)}</span><div><dt style="font-size: 14px; line-height: 20px; color: var(--text-subtle);">${esc(s.label)}</dt><dd style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700;">${esc(s.value)}</dd></div></div>`).join('');
  return `
  ${kitDefs()}
  <p role="status" class="sr" id="status"></p>
  ${kitHeader({ middle, coin: kitCoinChip(CONFIG.startCoins), active: 'courses' })}
  <div style="flex-grow: 1; display: flex; flex-wrap: wrap;">
    <nav class="rail in0" aria-label="${esc(T.navLabel)}" style="flex: 0 0 84px; background: #FFFFFF; display: flex; flex-direction: column;">${kitRail('courses')}</nav>
    <main style="flex: 999 1 560px; min-width: 0; background: #FAFAFA; border: 1px solid var(--border-default); border-radius: 16px 0 0 0; padding: 32px 32px 48px; box-sizing: border-box;">
      <div style="max-width: ${contentMax()}; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;">
        <section class="in1" aria-labelledby="ch-h" style="margin: -32px -32px 0; padding: 28px 32px 8px; border-radius: 16px 0 0 0; background: linear-gradient(180deg, var(--primary-mutedSelected) 0%, rgba(250,250,250,0) 100%);">
          <span style="display: inline-flex; align-items: center; height: 40px; margin-left: 22px; padding: 0 16px; border-radius: 10px 10px 0 0; background: var(--primary-default); color: var(--primary-onDefault); font: 600 19px/1 var(--font-sans);">${esc(CT.classTag)}</span>
          <div style="background: var(--bg-surface); border-radius: 16px; padding: 24px 28px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.08); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 32px;">
            <div style="display: flex; flex-direction: column; gap: 16px;">
              <h1 id="ch-h" style="margin: 0; font-size: 23px; line-height: 32px; font-weight: 600; color: var(--text-default);">${esc(CT.title)}</h1>
              <dl style="margin: 0; display: flex; flex-wrap: wrap; gap: 12px 32px;">${stats}</dl>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right;">${fsBtn('primary', CT.continueButton, 'class="pillBtn"')}</div>
          </div>
        </section>
        <section class="in2" aria-label="${esc(CT.listAria)}" id="listSec" style="display: flex; flex-direction: column; gap: 24px;"></section>
      </div>
    </main>
  </div>`;
}

function renderList(focusTab) {
  const all = CT.list;
  const count = (id) => all.filter((c) => id === 'all' || statusOf(c) === id).length;
  const order = { doing: 0, new: 1, done: 2 };
  const shown = all.filter((c) => cst.tab === 'all' || statusOf(c) === cst.tab).sort((x, y) => order[statusOf(x)] - order[statusOf(y)] || y.last - x.last);
  const tabs = STATUSES.map((id) => { const on = cst.tab === id; return `<button type="button" role="tab" aria-selected="${on}" tabindex="${on ? 0 : -1}" data-tab="${id}" class="af-tab${on ? ' is-selected' : ''}"><span class="af-tab-label">${esc(CT.tabs[id])}</span><span class="af-tab-count">${count(id)}</span></button>`; }).join('');
  const cards = shown.map((c) => {
    const k = statusOf(c), pct = Math.round(c.done / c.lessons * 100);
    const label = k === 'new' ? CT.progressNew : f(CT.progressLabel, { done: c.done, lessons: c.lessons });
    return `<li style="min-width: 0; display: flex;"><article class="af-course scard" style="width: 100%;">
      <div class="af-course-cover"><img class="af-course-img" src="${COVERS[c.cover]}" alt="">
        <span style="position: absolute; left: 0; top: 0; padding: 4px 16px; border-radius: 0 0 14px 0; background: ${TAG_COLOR[c.cover] || 'var(--primary-default)'}; color: #FFFFFF; font: 700 28px/40px var(--font-sans); letter-spacing: .25px;">${esc(CT.gradeTag)}</span>
        <span class="af-course-menu"><button type="button" class="af-btn af-btn--secondary-accent af-btn--md af-btn--icon-only" aria-label="${esc(f(CT.menuAria, { title: c.title }))}">${afIcon('icon-dots-horizontal', 20)}</button></span></div>
      <div class="af-course-meta">
        <div class="af-course-subject">${esc(f(CT.subjectLine, { subject: c.subject }))}</div>
        <h3 class="af-course-title" style="font-size: 20px; line-height: 28px;">${esc(c.title)}</h3>
        <p style="margin: auto 0 0; padding-top: 12px; display: flex; align-items: center; gap: 6px; font-size: 16px; line-height: 24px; color: var(--text-base-subtle);">${icon('book-open', 16)}${esc(f(CT.lessons, { n: c.lessons }))}</p>
        <div class="af-course-foot">${progressBar(pct, label, pct + '%', 'accent')}<button type="button" class="af-btn af-btn--primary af-btn--lg"><span class="af-btn-label">${esc(CT.cardButton[k])}</span></button></div>
      </div></article></li>`;
  }).join('');
  $('#listSec').innerHTML = `
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; border-bottom: 1px solid var(--border-default);"><div class="af-scope" style="margin-bottom: -1px;"><div role="tablist" aria-label="${esc(CT.tabsAria)}" class="af-tabs af-tabs--lg">${tabs}</div></div></div>
    <ul class="cgrid af-scope" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px;">${cards}</ul>
    ${shown.length ? '' : `<div style="padding: 40px 24px; border: 1px dashed var(--border-emphasized); border-radius: 16px; background: var(--bg-surface); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;"><p style="margin: 0; font-size: 18px; line-height: 26px; font-weight: 600;">${esc(CT.emptyTitle)}</p><p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--text-subtle);">${esc(CT.emptyText)}</p><button type="button" class="chip" data-act="clear" style="margin-top: 8px; height: 40px; padding: 0 18px; border-radius: 9999px; border: 1px solid var(--primary-default); background: var(--bg-surface); color: var(--primary-default); font: 600 15px var(--font-sans); cursor: pointer;">${esc(CT.clearFilters)}</button></div>`}`;
  if (focusTab) { const el = $(`[data-tab="${focusTab}"]`); if (el) el.focus(); }
}
function pickTab(id, focus) {
  cst.tab = id;
  setStatus(CT.status['show' + id[0].toUpperCase() + id.slice(1)]);
  renderList(focus ? id : null);
}

const root = $('#root');
kitMount(root, CONFIG.reduceMotion);
root.innerHTML = shell();
renderList();
root.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab) pickTab(t.dataset.tab);
  else if (t.dataset.act === 'clear') { cst.tab = 'all'; setStatus(CT.status.cleared); renderList(); }
});
root.addEventListener('keydown', (e) => {
  if (!e.target.closest('[data-tab]') || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
  e.preventDefault();
  const i = STATUSES.indexOf(cst.tab);
  pickTab(STATUSES[(i + (e.key === 'ArrowRight' ? 1 : STATUSES.length - 1)) % STATUSES.length], true);
});

</script>
</body>
</html>
